name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Verify release tag
        shell: pwsh
        run: |
          [xml] $project = Get-Content -Raw "src/Gproxyt/Gproxyt.csproj"
          $version = [string]$project.Project.PropertyGroup.Version | Select-Object -First 1
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if (-not [string]::Equals($tagVersion, $version, [StringComparison]::Ordinal)) {
              throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          & git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Release tags must point to a commit on main"
          }
          "GPROXYT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GPROXYT_PRERELEASE=$(($version -notmatch '-stable$').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and test
        shell: pwsh
        run: ./build.ps1
      - name: Create checksums
        shell: pwsh
        run: |
          $artifact = "dist/gproxyt.exe"
          $sha256 = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512 = (Get-FileHash -LiteralPath $artifact -Algorithm SHA512).Hash.ToLowerInvariant()
          "$sha256  gproxyt.exe" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii
          "$sha512  gproxyt.exe" | Set-Content -LiteralPath "dist/SHA512SUMS.txt" -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GPROXYT_PRERELEASE -eq "true") {
              gh release create $env:GITHUB_REF_NAME "dist/gproxyt.exe" "dist/SHA256SUMS.txt" "dist/SHA512SUMS.txt" --title "GProxyT $env:GPROXYT_VERSION" --generate-notes --verify-tag --prerelease
          } else {
              gh release create $env:GITHUB_REF_NAME "dist/gproxyt.exe" "dist/SHA256SUMS.txt" "dist/SHA512SUMS.txt" --title "GProxyT $env:GPROXYT_VERSION" --generate-notes --verify-tag --latest
          }
